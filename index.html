<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons stammen aus dem echten Markenlogo (public/logo/af-logo.png) — siehe scripts/generate-icons.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- EINE theme-color, nicht zwei nach `prefers-color-scheme`: Seit die App hell startet
         (2026-07-26), haetten zwei medienabhaengige Werte auf einem Handy im Nachtmodus eine
         DUNKLE Browserleiste um eine HELLE Seite gelegt. Das Skript unten haelt sie am
         tatsaechlichen Theme; `useTheme` zieht sie beim Umschalten nach. -->
    <meta name="theme-color" content="#f1efe9" />
    <meta name="description" content="Muskelfinder — Nachschlagewerk & Lern-Tool für die Skelettmuskulatur." />
    <title>Anatomie Fokus · Muskelfinder</title>
    <!-- Theme vor dem ersten Paint setzen (kein Flash). Liest den persistierten Zustand-Store;
         ohne eigene Wahl gilt **hell** — dieselbe Regel wie in `useThemeStore`. Diese Datei und
         der Store muessen denselben Default kennen, sonst blitzt beim Laden die falsche Farbe. -->
    <script>
      (function () {
        var DEFAULT_THEME = 'light';
        var t;
        try {
          var raw = localStorage.getItem('mf.theme');
          t = raw ? (JSON.parse(raw).state || {}).theme : null;
        } catch (e) {
          t = null;
        }
        t = t === 'dark' || t === 'light' ? t : DEFAULT_THEME;
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0c0e' : '#f1efe9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
